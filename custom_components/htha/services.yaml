set_time_window:
  fields:
    config_entry_id:
      required: false
      selector:
        config_entry:
          integration: htha
    time_program:
      required: true
      example: "Warmwasser"
      selector:
        text:
    days:
      required: false
      example: "weekdays"
      default: all
      selector:
        select:
          multiple: true
          translation_key: days
          options:
            - all
            - weekdays
            - weekend
            - mon
            - tue
            - wed
            - thu
            - fri
            - sat
            - sun
    start:
      required: true
      example: "11:00"
      selector:
        time:
    end:
      required: true
      example: "15:00"
      selector:
        time:
    state:
      required: false
      default: 1
      selector:
        number:
          min: 0
          max: 2
          mode: box
    off_state:
      required: false
      default: 0
      selector:
        number:
          min: 0
          max: 2
          mode: box

set_time_program_entry:
  fields:
    config_entry_id:
      required: false
      selector:
        config_entry:
          integration: htha
    time_program:
      required: true
      example: "Zirkulationspumpe"
      selector:
        text:
    days:
      required: false
      example: "sat"
      default: all
      selector:
        select:
          multiple: true
          translation_key: days
          options:
            - all
            - weekdays
            - weekend
            - mon
            - tue
            - wed
            - thu
            - fri
            - sat
            - sun
    entry:
      required: true
      example: 1
      selector:
        number:
          min: 0
          max: 9
          mode: box
    state:
      required: true
      example: 1
      selector:
        number:
          min: 0
          max: 2
          mode: box
    start:
      required: true
      example: "08:30"
      selector:
        time:
    end:
      required: true
      example: "19:00"
      selector:
        time:

refresh_time_programs:
  fields:
    config_entry_id:
      required: false
      selector:
        config_entry:
          integration: htha
